[package]
name = "ac-signals"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"

# This crate exists to ISOLATE the workspace-wide `unsafe_code = "forbid"`
# policy: signal(2) registration is inherently unsafe FFI, and confining it
# to a two-function crate keeps every other line of AgentCode forbid-clean.
# The unsafe surface is exactly one call per signal; see the SAFETY comments
# and DEP-ADM-021.
[lints.rust]
unsafe_code = "allow"
