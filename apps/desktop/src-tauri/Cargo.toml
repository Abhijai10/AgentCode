[package]
name = "agentcode-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"], default-features = false }
ac-agent = { path = "../../../crates/ac-agent" }
ac-provider = { path = "../../../crates/ac-provider" }
ac-common = { path = "../../../crates/ac-common" }
ac-daemon = { path = "../../../crates/ac-daemon" }
rfd = "0.15"
